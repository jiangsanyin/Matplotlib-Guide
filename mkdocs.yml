# ============================================================
# MkDocs 配置文件
# ============================================================
site_name: Python绘图库 - Matplotlib学习笔记
site_description: Matplotlib 数据可视化基础教程
site_author: jiangsanyin
site_url: http://127.0.0.1:8000/

# 文档源目录（你的 md 文件放这里）
docs_dir: source

# 生成html的输出目录
site_dir: docs

# ============================================================
# 主题配置（Material 主题，效果类似 thorough-pytorch）
# ============================================================
theme:
  name: material
  language: zh            # 中文界面
  features:
    - navigation.tabs     # 顶部标签栏
    - navigation.sections # 侧边栏分组
    - search.suggest      # 搜索建议
    - search.highlight    # 搜索高亮
    - content.code.copy   # 代码一键复制
  palette:
    - scheme: default     # 浅色模式
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - scheme: slate       # 深色模式
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

# ============================================================
# Markdown 扩展（支持代码高亮、提示框等）
# ============================================================
markdown_extensions:
  - admonition            # 提示框 !!! note
  - pymdownx.superfences  # 代码块增强
  - pymdownx.highlight:   # 代码高亮
      linenums: true      # 显示行号
  - pymdownx.tabbed:      # 标签页
      alternate_style: true
  - toc:
      permalink: true     # 标题锚点链接

# ============================================================
# 导航栏（控制左侧目录顺序）
# ============================================================
nav:
  - 首页: index.md
  - 第1章 安装与初识Matplotlib: 第1章-01安装与初识Matplotlib.md
  - 第2章 官方文档的介绍: 第2章-02官方文档的介绍.md
  - 第3章 Matplotlib中图的组成: 第3章-03Matplotlib中图表的组成.md
  - 第4章 Matplotlib中对图的操作: 第4章-04Matplotlib中对图表的操作.md
  - 第5章 Matplotlib绘制常用图表: 第5章-05Matplotlib绘制常用图表.md
  - 第6章 注意事项: 第6章-06注意事项.md